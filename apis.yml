apis:
- name: Forescout Web API (Open Integration Module)
  description: >-
    The Web API plugin of the Forescout eyeExtend Connect Open Integration
    Module lets external systems query and act on the Forescout platform over
    HTTP. Clients authenticate at POST /api/login and pass the returned JWT in
    the Authorization header on subsequent requests to endpoints such as
    /api/hosts, /api/policies, and /api/hostfields.
  humanURL: https://docs.forescout.com/bundle/web-api-1-5-3-h/page/web-api-1-5-3-h.RESTful-Web-Service-Interaction.html
  baseURL: https://your-forescout-appliance/api
  tags:
  - Device Visibility
  - Asset Inventory
  - Network Policy
  properties:
  - type: Documentation
    url: https://docs.forescout.com/bundle/web-api-1-5-3-h/
  - type: Authentication
    url: authentication/forescout-authentication.yml
  - type: Postman
    url: https://github.com/Forescout/examples/tree/master/web-api/postman
- name: Forescout eyeInspect Command Center REST API
  description: >-
    REST API for the eyeInspect (SilentDefense) OT/ICS Command Center, providing
    access to asset inventory (hosts), alerts, vulnerabilities, sensors, and
    blacklists. Uses HTTP basic authentication against the Command Center server.
  humanURL: https://docs.forescout.com/bundle/eyeinspect_api_guide_v5_5_0/page/gitdoc-eyeinspect/eyeInspect/eyeinspect_api_guide/about_eyeinspect_api.html
  baseURL: https://your-eyeinspect-cc/api
  tags:
  - OT Security
  - Asset Inventory
  - Vulnerability Management
  properties:
  - type: Documentation
    url: https://docs.forescout.com/bundle/eyeinspect_api_guide_v5_5_0/
- name: Forescout eyeSight Admin API
  description: >-
    Administrative REST API plugin for the Forescout eyeSight platform, used to
    manage appliance configuration and switch/device administration surfaced in
    the Forescout examples repository (admin-switch-api).
  humanURL: https://docs.forescout.com/bundle/admin-api-1-0-h/
  baseURL: https://your-forescout-appliance/api
  tags:
  - Administration
  - Network Security
  properties:
