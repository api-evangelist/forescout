aid: forescout
name: Forescout
description: >-
  Forescout Technologies is a cybersecurity company specializing in automated
  cybersecurity for device visibility, control, and compliance across IT, OT/ICS,
  IoT, and IoMT environments. The Forescout Platform (eyeSight, eyeControl,
  eyeInspect, eyeExtend, and Risk & Exposure Management) discovers, classifies,
  assesses, and secures every connected asset on the network without requiring
  agents. Forescout exposes REST APIs for external integration through the Open
  Integration Module (OIM) of eyeExtend Connect — the Web API and Data Exchange
  (DEX) plugins — plus the eyeSight Admin API and the eyeInspect Command Center
  REST API, giving programmatic access to host inventory, network policies,
  alerts, and vulnerability data. First-party integration example code (Python,
  Node, and Postman collections) is published in the Forescout GitHub org.
